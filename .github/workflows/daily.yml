name: Daily GlobeNewswire Alert

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r globenews-alert/requirements.txt

      - name: 요약에 필요한 nltk 데이터 다운로드
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: 뉴스 수집 · 요약 · 전송 실행
        working-directory: globenews-alert
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: python main.py
